<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 페이지</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="loginScreen" class="admin-login-wrap">
  <form id="loginForm" class="admin-login-card">
    <h1>관리자 로그인</h1>
    <p class="admin-hint">비밀번호를 입력하세요.</p>
    <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="off" required>
    <button type="submit" class="btn btn-primary">로그인</button>
    <p id="loginError" class="admin-error" hidden></p>
  </form>
</div>

<div id="adminPanel" class="admin-panel" hidden>
  <header class="admin-header">
    <h1 id="adminTitle">프로젝트 관리</h1>
    <nav class="admin-tabs" aria-label="관리 메뉴">
      <a href="#projects" class="admin-tab is-active" data-view="projects">프로젝트 관리</a>
      <a href="#reservations" class="admin-tab" data-view="reservations">예약하기 관리</a>
      <button id="logoutBtn" class="btn btn-outline btn-sm">로그아웃</button>
    </nav>
  </header>

  <!-- 프로젝트 관리 화면 -->
  <div id="projectsView" class="admin-view">

  <section id="duplicateBanner" class="admin-duplicate-banner" hidden>
    <h2>중복 의심 프로젝트</h2>
    <div id="duplicateList"></div>
  </section>

  <section class="admin-form-section">
    <h2 id="formTitle">새 프로젝트 추가</h2>
    <form id="projectForm" class="admin-form">
      <input type="hidden" id="projectId">

      <label>제목
        <input type="text" id="fieldTitle" placeholder="예: 용맥(龍脈) 도시숲 생태 네트워크 설계">
      </label>

      <label>내가 한 역할
        <input type="text" id="fieldRole" placeholder="예: 데이터 분석 및 공간 설계 담당">
      </label>

      <label>설명
        <textarea id="fieldDescription" rows="4" placeholder="예: 어떤 문제를 발견했고, 어떤 데이터로 어떻게 해결했는지 적어주세요."></textarea>
      </label>

      <label>날짜
        <input type="text" id="fieldDate" placeholder="예: 2026-03-15">
      </label>

      <label>참여인원수
        <input type="text" id="fieldMemberCount" placeholder="예: 4명">
      </label>

      <label>참고사항 <span class="admin-optional">(선택)</span>
        <textarea id="fieldNote" rows="2" placeholder="예: 팀 프로젝트이며 본인은 데이터 분석 파트를 담당함"></textarea>
      </label>

      <label>영상 <span class="admin-optional">(선택)</span>
        <input type="file" id="fieldVideoFile" accept="video/*">
        <input type="hidden" id="fieldVideoUrl">
        <p id="videoUploadStatus" class="admin-video-status"></p>
      </label>

      <fieldset class="admin-status-fieldset">
        <legend>공개 상태</legend>
        <label class="admin-radio"><input type="radio" name="status" value="draft" checked> 초안 (나만 볼 수 있음)</label>
        <label class="admin-radio"><input type="radio" name="status" value="published"> 공개 (웹사이트에 표시됨)</label>
      </fieldset>

      <p id="formError" class="admin-error" hidden></p>

      <div class="admin-form-actions">
        <button type="submit" class="btn btn-primary">저장</button>
        <button type="button" id="resetFormBtn" class="btn btn-outline">새로 작성</button>
      </div>
    </form>
  </section>

  <section class="admin-list-section">
    <h2>전체 프로젝트 목록</h2>
    <div id="projectList" class="admin-project-list"></div>
  </section>
  </div>

  <!-- 예약하기 관리 화면 -->
  <div id="reservationsView" class="admin-view" hidden>
    <section class="admin-list-section">
      <div class="admin-res-head">
        <h2>예약 요청 목록</h2>
        <button type="button" id="reloadReservationsBtn" class="btn btn-outline btn-sm">새로고침</button>
      </div>
      <p class="admin-hint">관리 열의 버튼으로 처리 상태를 바꿀 수 있습니다. 접수: 신청 그대로 · 확정: 승인 · 변경 요청: 다른 시간 제안 · 취소: 방문 거절</p>
      <p id="reservationError" class="admin-error" hidden></p>

      <!-- 처리 상태별 요약 -->
      <p id="reservationSummary" class="admin-res-summary" aria-live="polite"></p>

      <!-- 처리 상태 필터 -->
      <div id="reservationFilters" class="admin-res-filters" role="group" aria-label="처리 상태 필터">
        <button type="button" class="admin-res-filter is-active" data-filter="전체" aria-pressed="true">전체 <span class="count">0</span></button>
        <button type="button" class="admin-res-filter received" data-filter="접수" aria-pressed="false">접수 <span class="count">0</span></button>
        <button type="button" class="admin-res-filter confirmed" data-filter="확정" aria-pressed="false">확정 <span class="count">0</span></button>
        <button type="button" class="admin-res-filter change" data-filter="변경 요청" aria-pressed="false">변경 요청 <span class="count">0</span></button>
        <button type="button" class="admin-res-filter cancelled" data-filter="취소" aria-pressed="false">취소 <span class="count">0</span></button>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-res-table">
          <thead>
            <tr>
              <th scope="col">예약 번호</th>
              <th scope="col">신청자/이메일</th>
              <th scope="col">방문 희망 시간</th>
              <th scope="col">방문 목적</th>
              <th scope="col">처리 상태</th>
              <th scope="col">관리</th>
            </tr>
          </thead>
          <tbody id="reservationTableBody">
            <tr><td colspan="6" class="admin-res-empty">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
